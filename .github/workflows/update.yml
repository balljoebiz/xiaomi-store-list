name: Update Xiaomi HK store list

on:
  schedule:
    # 香港時間 13:31（UTC+8）。固定時間最穩：GitHub 排程本身可能延遲數十分鐘，
    # 若用「隨機時段 + 每小時判斷」，很容易整天錯過目標時段而連續多日不更新。
    - cron: '31 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-xiaomi-stores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build store page
        run: node build-xiaomi-html.js

      # 一致性掃描（A–J）。只作報告，不阻擋更新：單一資料異常不應讓頁面停止更新。
      - name: Consistency scan (report only)
        continue-on-error: true
        run: node scripts/scan-consistency.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 用 status 而非 diff：store-history.json 首次產生時是 untracked，diff 看不到
          if [ -z "$(git status --porcelain -- index.html xiaomi-stores.json store-history.json)" ]; then
            echo "資料未變，不產生 commit。"
            exit 0
          fi
          STATS=$(node -e "const j=require('./xiaomi-stores.json');console.log(j.activeCount+' 間在架・'+j.removedCount+' 已移除・'+j.closedCount+' 已閉店')")
          git add index.html xiaomi-stores.json store-history.json   # history 必須 commit，否則 30 天計時會重置
          git commit -m "更新小米之家門市資料（${STATS}）"
          git push
